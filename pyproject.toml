[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miosa-mcp"
version = "0.1.0"
description = "MCP server that exposes MIOSA computer-use tools to Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "MIOSA", email = "dev@miosa.ai" },
]
keywords = ["miosa", "mcp", "claude", "ai", "agents", "desktop", "computer-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "mcp>=1.0.0",
    "miosa>=0.3.0",
]

[project.scripts]
miosa-mcp = "miosa_mcp:main"

[project.urls]
Homepage = "https://miosa.ai"
Documentation = "https://docs.miosa.ai/mcp"

[tool.hatch.build.targets.wheel]
packages = ["miosa_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
